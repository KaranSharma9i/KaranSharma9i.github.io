<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Karan Sharma's data analysis blog — insights, walkthroughs and findings from real-world projects.">
<title>Blogs | Karan Sharma</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=clash-display@600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F8F6F1;--surface:#FFF;--primary:#E27500;--accent:#65BC7B;
  --text:#1C1C1C;--subtle:#6B7280;--border:#E8E5DF;
  --heading:'Clash Display',sans-serif;--body:'General Sans',sans-serif;
  --shadow:0 4px 24px rgba(0,0,0,0.06);--radius:16px;
}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--text);overflow-x:hidden;line-height:1.6}
h1,h2,h3{font-family:var(--heading);font-weight:700;line-height:1.2}
a{color:inherit;text-decoration:none}

/* ── Top Bar ── */
.topbar{position:sticky;top:0;z-index:100;background:rgba(248,246,241,0.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:14px 5%;
  display:flex;align-items:center;justify-content:space-between}
.topbar-left{display:flex;align-items:center;gap:14px}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;
  border-radius:999px;background:var(--surface);border:1px solid var(--border);
  font-size:13px;font-weight:500;color:var(--subtle);transition:all .3s ease}
.back-btn:hover{border-color:var(--primary);color:var(--primary)}
.topbar-title{font-family:var(--heading);font-size:20px;font-weight:700}
.topbar-title span{color:var(--primary)}

/* ── Layout ── */
.layout{display:flex;max-width:1300px;margin:0 auto;padding:48px 5% 80px;gap:40px}

/* ── Sidebar ── */
.sidebar{width:260px;flex-shrink:0;position:sticky;top:90px;height:fit-content}
.sidebar-label{font-size:11px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;color:var(--subtle);margin-bottom:14px}
.sidebar-nav{display:flex;flex-direction:column;gap:4px}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:10px;font-size:13px;font-weight:500;color:var(--subtle);
  transition:all .25s ease;border-left:2px solid transparent}
.sidebar-nav a:hover{background:var(--surface);color:var(--text)}
.sidebar-nav a.active{background:var(--surface);color:var(--primary);
  border-left-color:var(--primary);box-shadow:var(--shadow)}
.sidebar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Main Content ── */
.main{flex:1;display:flex;flex-direction:column;gap:0}

/* ── Blog Section ── */
.blog-section{padding:64px 0;border-bottom:1px solid var(--border)}
.blog-section:last-child{border-bottom:none}
.blog-section-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:40px}
.blog-section-icon{width:56px;height:56px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.blog-section-meta{flex:1}
.blog-section-tag{font-size:11px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:6px;opacity:.7}
.blog-section-title{font-size:clamp(22px,3vw,32px);margin-bottom:8px}
.blog-section-desc{font-size:14px;color:var(--subtle)}

/* ── Blank Page Placeholder ── */
.blog-placeholder{border-radius:var(--radius);padding:56px 40px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;min-height:320px;border:1.5px dashed}
.blog-placeholder-icon{font-size:48px;margin-bottom:20px;opacity:.4}
.blog-placeholder-heading{font-family:var(--heading);font-size:22px;
  font-weight:700;margin-bottom:10px;opacity:.5}
.blog-placeholder-sub{font-size:14px;opacity:.4;max-width:360px;line-height:1.6}
.coming-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;
  border-radius:999px;font-size:12px;font-weight:600;margin-top:20px;opacity:.6}

/* ── Responsive ── */
@media(max-width:900px){
  .layout{flex-direction:column;padding-top:32px}
  .sidebar{width:100%;position:static;overflow-x:auto}
  .sidebar-nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .sidebar-nav a{padding:7px 12px;border-left:none;border-bottom:2px solid transparent}
  .sidebar-nav a.active{border-left:none;border-bottom-color:var(--primary)}
}
</style>
</head>
<body>

<!-- Top Bar -->
<header class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
    <div class="topbar-title">Karan <span>Blogs</span></div>
  </div>
  <div style="font-size:13px;color:var(--subtle)">9 topics · Data & Analytics</div>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-label">Topics</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- Main -->
  <main class="main" id="blogMain"></main>

</div>

<script>
const blogs=[
  {
    id:'steam-success',title:'What Makes a Game Successful on STEAM',
    tag:'Game Analytics',icon:'🎮',
    accent:'#E27500',bg:'#FFF8F0',border:'#F5D9B0',dot:'#E27500',
    desc:'Exploring pricing, genre, review patterns and user behaviour data from thousands of STEAM game listings.'
  },
  {
    id:'churn-analysis',title:'Customer Churn Analysis',
    tag:'Business Analytics',icon:'📉',
    accent:'#27AE60',bg:'#F0FAF4',border:'#B0E0C0',dot:'#27AE60',
    desc:'Identifying at-risk customer segments through logistic regression, decision trees and feature importance.'
  },
  {
    id:'brazil-ecommerce',title:'Brazilian E-Commerce Sales Analysis',
    tag:'E-Commerce Analytics',icon:'🛒',
    accent:'#2980B9',bg:'#F0F7FD',border:'#AECDE8',dot:'#2980B9',
    desc:'Uncovering regional patterns, delivery bottlenecks and satisfaction drivers in the Olist dataset.'
  },
  {
    id:'covid-data',title:'COVID-19 Data Exploration',
    tag:'Public Health Data',icon:'🦠',
    accent:'#C0392B',bg:'#FDF2F1',border:'#F0B8B3',dot:'#C0392B',
    desc:'Time-series analysis of infection rates, vaccination rollouts and economic disruption indicators.'
  },
  {
    id:'hr-attrition',title:'HR Employee Attrition Dashboard',
    tag:'HR Analytics',icon:'👥',
    accent:'#8E44AD',bg:'#F9F4FD',border:'#DABFEF',dot:'#8E44AD',
    desc:'Visualising attrition risk factors — overtime, satisfaction, tenure — in an interactive Power BI dashboard.'
  },
  {
    id:'credit-risk',title:'Credit Risk Assessment',
    tag:'Financial Analytics',icon:'💳',
    accent:'#16A085',bg:'#F0FBF8',border:'#A8E0D5',dot:'#16A085',
    desc:'Building a statistical scoring model for loan default probability using correlation analysis and weighted indicators.'
  },
  {
    id:'sentiment-tracker',title:'Social Media Sentiment Tracker',
    tag:'NLP & Text Analytics',icon:'💬',
    accent:'#D35400',bg:'#FDF4EE',border:'#EFC09A',dot:'#D35400',
    desc:'Analysing tweet sentiment around product launches with NLP techniques and time-based visualisations.'
  },
  {
    id:'weather-climate',title:'Weather & Climate Pattern Analysis',
    tag:'Environmental Analytics',icon:'🌦️',
    accent:'#1A5276',bg:'#EEF6FC',border:'#A9CCE3',dot:'#1A5276',
    desc:'Fifty years of meteorological data examined for trend shifts, seasonal anomalies and distributional changes.'
  },
  {
    id:'retail-forecast',title:'Retail Sales Forecasting Dashboard',
    tag:'Forecasting & BI',icon:'🏪',
    accent:'#117A65',bg:'#EDFAF7',border:'#A2D9CE',dot:'#117A65',
    desc:'Time-series decomposition and Tableau dashboards for predicting quarterly revenue in a retail chain.'
  },
];

// Build sidebar
const nav=document.getElementById('sidebarNav');
blogs.forEach((b,i)=>{
  const a=document.createElement('a');
  a.href=`#${b.id}`;
  a.innerHTML=`<span class="sidebar-dot" style="background:${b.dot}"></span>${b.title}`;
  if(i===0)a.classList.add('active');
  nav.appendChild(a);
});

// Build main sections
const main=document.getElementById('blogMain');
blogs.forEach(b=>{
  const section=document.createElement('section');
  section.className='blog-section';
  section.id=b.id;
  section.innerHTML=`
    <div class="blog-section-header">
      <div class="blog-section-icon" style="background:${b.bg};border:1px solid ${b.border}">${b.icon}</div>
      <div class="blog-section-meta">
        <div class="blog-section-tag" style="color:${b.accent}">${b.tag}</div>
        <h2 class="blog-section-title">${b.title}</h2>
        <p class="blog-section-desc">${b.desc}</p>
      </div>
    </div>
    <div class="blog-placeholder" style="background:${b.bg};border-color:${b.border}">
      <div class="blog-placeholder-icon">${b.icon}</div>
      <div class="blog-placeholder-heading" style="color:${b.accent}">Blog coming soon</div>
      <p class="blog-placeholder-sub">I'm working on a detailed write-up of this project — analysis, findings, charts and key takeaways. Check back soon!</p>
      <span class="coming-badge" style="background:${b.border};color:${b.accent}"><i class="fa-solid fa-pen-to-square"></i> In progress</span>
    </div>`;
  main.appendChild(section);
});

// Active sidebar on scroll
const sidebarLinks=[...nav.querySelectorAll('a')];
const sections=[...document.querySelectorAll('.blog-section')];
window.addEventListener('scroll',()=>{
  let current=sections[0].id;
  sections.forEach(s=>{if(scrollY>=s.offsetTop-200)current=s.id});
  sidebarLinks.forEach(a=>{
    a.classList.remove('active');
    if(a.getAttribute('href')==='#'+current)a.classList.add('active');
  });
});

// Scroll to hash on load
if(location.hash){
  setTimeout(()=>{
    const el=document.querySelector(location.hash);
    if(el)el.scrollIntoView({behavior:'smooth'});
  },100);
}
</script>
</body>
</html>
